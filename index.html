<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop Stats</title>
<meta name="description" content="Live Project Zomboid Workshop stats — subscribers, favourites, views and ratings.">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M6 22 L13 14 L19 18 L26 9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
/* ---- Tokens -------------------------------------------------------------
   Light is the base; the dark values are declared twice on purpose — once for
   the OS setting, once for the in-page toggle — so the toggle wins both ways. */
:root {
  color-scheme: light;
  --plane:      #f9f9f7;
  --surface:    #fcfcfb;
  --ink:        #0b0b0b;
  --ink-2:      #52514e;
  --muted:      #898781;
  --grid:       #e1e0d9;
  --border:     rgba(11,11,11,0.10);
  --up:         #006300;
  --down:       #d03b3b;
  --s1:         #2a78d6;
  --s2:         #eb6834;
  --s3:         #1baf7a;
  --s4:         #eda100;
  --s5:         #7d57d1;
  --s6:         #c25596;
  --s7:         #0f93a6;
  --shadow:     0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:   #0d0d0d;
    --surface: #1a1a19;
    --ink:     #ffffff;
    --ink-2:   #c3c2b7;
    --muted:   #898781;
    --grid:    #2c2c2a;
    --border:  rgba(255,255,255,0.10);
    --up:      #0ca30c;
    --down:    #e66767;
    --s1:      #3987e5;
    --s2:      #d95926;
    --s3:      #199e70;
    --s4:      #c98500;
    --s5:      #9370e8;
    --s6:      #b04f8b;
    --s7:      #17a5ba;
    --shadow:  0 1px 2px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:   #0d0d0d;
  --surface: #1a1a19;
  --ink:     #ffffff;
  --ink-2:   #c3c2b7;
  --muted:   #898781;
  --grid:    #2c2c2a;
  --border:  rgba(255,255,255,0.10);
  --up:      #0ca30c;
  --down:    #e66767;
  --s1:      #3987e5;
  --s2:      #d95926;
  --s3:      #199e70;
  --s4:      #c98500;
  --s5:      #9370e8;
  --s6:      #b04f8b;
  --s7:      #17a5ba;
  --shadow:  0 1px 2px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 24px 20px 64px;
  background: var(--plane);
  color: var(--ink);
  font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1080px; margin: 0 auto; }

/* ---- Header ---- */
header {
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 8px 16px; margin-bottom: 28px;
}
h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.status {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--ink-2);
}
.pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--up); flex: none;
}
.pulse[data-state="stale"] { background: var(--muted); }
.pulse[data-state="error"] { background: var(--down); }
@media (prefers-reduced-motion: no-preference) {
  .pulse[data-state="live"] { animation: breathe 2.6s ease-in-out infinite; }
}
@keyframes breathe { 50% { opacity: 0.35; } }

button {
  font: inherit; font-size: 13px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 11px; cursor: pointer;
  min-height: 30px;
}
button:hover { color: var(--ink); }
button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-color: var(--muted); }
:is(button, a, summary, select):focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

/* ---- Filter row: one row, above everything it scopes ---- */
.filters {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.section-head .label { font-size: 13px; color: var(--muted); margin-right: 2px; }
.seg { display: flex; gap: 4px; }
/* Two segs in one row read as one nine-button strip without this. */
.filters .seg + .seg { margin-left: 6px; padding-left: 14px; border-left: 1px solid var(--grid); }
.sort-group { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.sort-group select {
  font: inherit; font-size: 13px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 8px; min-height: 30px; cursor: pointer;
}
#sortdir { min-width: 32px; padding: 5px 8px; }

/* ---- Focus scope ---- */
.crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.crumb #crumb-back {
  background: none; border: 0; padding: 0; min-height: 0;
  color: var(--ink-2); text-decoration: underline; cursor: pointer;
}
.crumb #crumb-back:hover { color: var(--ink); }
.crumb .cur { color: var(--ink); font-weight: 600; }

/* The update log gets the cards container to itself: in focus scope there is
   one mod, and a grid of one card next to a chart of the same mod is a
   duplicate, not a summary. */
.cards.focus-view { display: block; }
.focus-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; font-size: 12px; }
.log-row {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 10px 0; border-top: 1px solid var(--grid); font-size: 13.5px;
}
.log-row:first-child { border-top: 0; }
.log-when { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.log-impact { margin-left: auto; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.log-vs { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-note { margin-left: auto; font-size: 12.5px; color: var(--muted); }

/* ---- Hero ---- */
.hero {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow);
  padding: 22px 24px 18px; margin-bottom: 16px;
}
.hero-top {
  display: flex; align-items: flex-end; gap: 16px 24px;
  flex-wrap: wrap; margin-bottom: 12px;
}
.hero-controls {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-left: auto;
}
.hero-label { font-size: 13px; color: var(--ink-2); margin-bottom: 2px; }
.hero-value { font-size: 56px; font-weight: 650; line-height: 1.05; letter-spacing: -0.025em; }
.hero-sub { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.hero-window { font-size: 13px; color: var(--muted); }
.axis {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted); margin-top: 3px;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.legend:empty { display: none; }
.leg {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px; padding: 3px 10px; min-height: 26px; font-size: 12.5px;
}
.leg[aria-pressed="true"] { font-weight: 500; border-color: var(--border); }
.leg[aria-pressed="false"] { opacity: 0.5; }
.leg[aria-pressed="false"] .swatch { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }

.delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
.delta[data-dir="up"]   { color: var(--up); }
.delta[data-dir="down"] { color: var(--down); }
.delta[data-dir="flat"] { color: var(--muted); font-weight: 400; }

/* ---- KPI row ---- */
.kpis {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 16px; margin-bottom: 28px;
}
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px;
}
.kpi .k-label { font-size: 12.5px; color: var(--ink-2); }
.kpi .k-value { font-size: 27px; font-weight: 650; letter-spacing: -0.02em; margin: 3px 0 2px; }

/* ---- Mod cards ---- */
h2.section {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--muted); margin: 0 0 12px;
}
.section-head {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-bottom: 12px;
}
.section-head h2.section { margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px 14px;
  display: flex; flex-direction: column;
}
.card { cursor: pointer; }
.card:hover { border-color: var(--muted); }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.card-focus {
  margin-left: auto; padding: 2px 8px; min-height: 24px;
  color: var(--muted); font-size: 15px; line-height: 1;
}
.card:hover .card-focus { color: var(--ink); }
.swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.card-head a { color: inherit; text-decoration: none; font-weight: 600; font-size: 14.5px; }
.card-head a:hover { text-decoration: underline; }
.card-value { font-size: 38px; font-weight: 650; line-height: 1.05; letter-spacing: -0.025em; }
.card-value-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
.card-value-label { font-size: 12.5px; color: var(--ink-2); }

.spark { position: relative; margin: 10px 0 12px; min-height: 62px; }
.spark svg { display: block; }
.spark-empty {
  height: 62px; display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 0 12px;
  font-size: 12.5px; color: var(--muted);
  border: 1px dashed var(--grid); border-radius: 8px;
}
.spark-note { font-size: 10.5px; fill: var(--muted); }
.tip {
  position: absolute; pointer-events: none; opacity: 0;
  transform: translate(-50%, -100%);
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; line-height: 1.35; white-space: nowrap;
  color: var(--ink); z-index: 5;
}
.tip b { font-weight: 650; }
.tip .tip-t { color: var(--muted); font-size: 11px; display: block; }
.tip .tip-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.tip .tip-row span:last-child { margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }
.tip .tip-rule { border-top: 1px solid var(--grid); margin: 5px 0 3px; }

.foot {
  display: flex; gap: 18px; flex-wrap: wrap;
  border-top: 1px solid var(--grid); padding-top: 11px; margin-top: auto;
}
.foot div { font-size: 12.5px; color: var(--ink-2); }
.foot b { display: block; font-size: 16px; font-weight: 650; color: var(--ink); letter-spacing: -0.01em; }
.foot .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
.foot2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; font-size: 12px; }
/* The tint is a field, never the figure itself: the delta above owns coloured
   text, and tinting these numbers the same way would read as a second change
   reading. Hue lands on the border, the wash and the marker glyph only. */
.pill {
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--ink) 3%, transparent);
  color: var(--muted);
}
.pill b { font-weight: 600; color: var(--ink-2); }
.pill[data-cal="high"] {
  border-color: color-mix(in srgb, var(--up) 34%, transparent);
  background: color-mix(in srgb, var(--up) 8%, transparent);
}
.pill[data-cal="low"] {
  border-color: color-mix(in srgb, var(--down) 34%, transparent);
  background: color-mix(in srgb, var(--down) 8%, transparent);
}
/* Triangles, where the delta uses arrows — the two must not be mistaken for
   each other at a glance. */
.pill .cal { font-size: 10px; }
.pill[data-cal="high"] .cal { color: var(--up); }
.pill[data-cal="low"] .cal { color: var(--down); }

/* ---- Table view (the WCAG-clean twin) ---- */
details.table-view { margin-top: 28px; }
details.table-view summary {
  cursor: pointer; font-size: 13px; color: var(--ink-2);
  padding: 6px 0; width: fit-content;
}
details.table-view summary:hover { color: var(--ink); }
.table-scroll { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 760px; }
th, td { text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
tbody td { font-variant-numeric: tabular-nums; color: var(--ink); }
tfoot td { font-weight: 650; font-variant-numeric: tabular-nums; border-bottom: none; }
.name-cell { display: flex; align-items: center; gap: 8px; }
th .th-sort {
  background: none; border: 0; padding: 0; min-height: 0;
  font: inherit; color: inherit; cursor: pointer;
}
th .th-sort:hover { color: var(--ink); }
th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--ink); }
th[aria-sort="ascending"] .th-sort::after { content: " ↑"; }
th[aria-sort="descending"] .th-sort::after { content: " ↓"; }

footer.page {
  margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--grid);
  font-size: 12.5px; color: var(--muted);
}
footer.page a { color: var(--ink-2); }

.err {
  background: var(--surface); border: 1px solid var(--down);
  border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px;
}

@media (max-width: 620px) {
  body { padding: 18px 14px 48px; }
  .hero { padding: 18px; }
  .hero-value { font-size: 46px; }
  .hero-controls { margin-left: 0; }
  .sort-group { margin-left: 0; }
  .kpis { grid-template-columns: 1fr; gap: 12px; }
  .kpi { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 13px 16px; }
  .kpi .k-value { font-size: 22px; margin: 0; }
}

/* Refetch holds the previous render rather than flashing a skeleton. */
.wrap { transition: opacity 120ms ease; }
.wrap[data-loading="true"] { opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <header>
    <h1>Workshop Stats</h1>
    <div class="status">
      <span class="pulse" id="pulse" data-state="live"></span>
      <span id="freshness">Loading…</span>
      <button id="theme" type="button" title="Switch theme" aria-label="Switch colour theme">Theme</button>
    </div>
  </header>

  <div id="error-slot"></div>

  <nav class="crumb" id="crumb" hidden aria-label="Scope">
    <button type="button" id="crumb-back">All mods</button>
    <span class="sep" aria-hidden="true">›</span>
    <span class="cur" id="crumb-cur"></span>
  </nav>

  <div class="filters">
    <div class="seg" id="metric" role="group" aria-label="Metric">
      <button type="button" data-metric="subs" aria-pressed="true">Subscribers</button>
      <button type="button" data-metric="favs">Favourites</button>
      <button type="button" data-metric="views">Views</button>
    </div>
    <div class="seg" id="range" role="group" aria-label="Comparison window">
      <button type="button" data-hours="3">3h</button>
      <button type="button" data-hours="6">6h</button>
      <button type="button" data-hours="24">24h</button>
      <button type="button" data-hours="168" aria-pressed="true">7d</button>
      <button type="button" data-hours="720">30d</button>
      <button type="button" data-hours="0">All</button>
    </div>
  </div>

  <section class="hero" id="hero" aria-label="Total subscribers">
    <div class="hero-top">
      <div>
        <div class="hero-label" id="hero-label">Total subscribers</div>
        <div class="hero-value" id="hero-value">—</div>
        <div class="hero-sub">
          <span class="delta" id="hero-delta" data-dir="flat">—</span>
          <span class="hero-window" id="hero-window"></span>
        </div>
      </div>
      <div class="hero-controls">
        <div class="seg" id="mode" role="group" aria-label="Chart mode">
          <button type="button" data-mode="total" aria-pressed="true">Total</button>
          <button type="button" data-mode="stacked">Stacked</button>
          <button type="button" data-mode="velocity">Velocity</button>
          <button type="button" data-mode="churn" title="Everyone who subscribed against what stuck">Churn</button>
          <button type="button" data-mode="launch">Since launch</button>
        </div>
        <button type="button" id="hero-log" aria-pressed="false" title="Logarithmic scale">Log</button>
      </div>
    </div>
    <div class="spark" id="hero-spark"></div>
    <div class="axis" id="hero-axis"></div>
    <div class="legend" id="hero-legend"></div>
  </section>

  <div class="kpis" id="kpis"></div>

  <div class="section-head">
    <h2 class="section" id="cards-head">By mod</h2>
    <div class="sort-group" id="sort-group">
      <label class="label" for="sort">Sort by</label>
      <select id="sort"></select>
      <button type="button" id="sortdir" title="Reverse sort direction">↓</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>

  <details class="table-view">
    <summary>Table view — every number in plain text</summary>
    <div class="table-scroll">
      <table id="table">
        <thead><tr></tr></thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
  </details>

  <footer class="page">
    <span id="foot-note">Checked automatically every 15 minutes; this page refreshes itself every minute.</span>
  </footer>
</div>

<script>
"use strict";

const SLOT_VAR = { 1: "--s1", 2: "--s2", 3: "--s3", 4: "--s4", 5: "--s5", 6: "--s6", 7: "--s7" };
const POLL_MS = 60_000;
const FIELD = { t: 0, subs: 1, favs: 2, views: 3, lifeSubs: 4, lifeFavs: 5, up: 6, down: 7 };

// The poller rewrites history.json every 5 minutes. Keeping it on its own
// orphan branch instead of in the site means those rewrites cost master
// nothing. raw.githubusercontent serves it with `access-control-allow-origin:
// *`, so the cross-origin fetch is fine.
const DATA_BRANCH = "stats-data";
// Hardcoded because the page is served from Vercel: there's no github.io
// hostname to derive it from. Change it if you fork or rename the repo.
const DATA_REPO = "nickjgg/pz-mod-stats";

function dataUrl() {
  return `https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/history.json`;
}

let data = null;

// Zero is "all history". Anything below 24 leans on the poller's real cadence —
// see velocityOk().
const RANGES = [3, 6, 24, 168, 720, 0];

// Builds before the sub-day windows stored this as whole days under `rangeDays`;
// a returning reader keeps the window they picked instead of silently landing on
// the default. Both keys are read defensively because `Number(null)` is 0, which
// is itself a valid range.
function readRange() {
  const stored = localStorage.getItem("rangeHours");
  if (stored !== null && RANGES.includes(Number(stored))) return Number(stored);
  const legacy = localStorage.getItem("rangeDays");
  if (legacy !== null && RANGES.includes(Number(legacy) * 24)) return Number(legacy) * 24;
  return 168;
}
let rangeHours = readRange();

// What the charts, the cards and the derived figures are all measuring. A metric
// is a running total Steam publishes, optionally with a lifetime counter behind
// it: `life` is what makes churn and keep-rate possible at all, since it is the
// only way to see someone leave. Views has no lifetime pair and needs none — a
// view is never taken back — which is also why it can be a denominator but never
// have one.
const METRICS = {
  subs: {
    key: "subs", label: "Subscribers", noun: "subscribers",
    field: FIELD.subs, life: FIELD.lifeSubs,
    gained: "subscribed", lost: "left", lostLabel: "Unsubscribed",
    churnAria: "Subscribers joining against subscribers leaving",
  },
  favs: {
    key: "favs", label: "Favourites", noun: "favourites",
    field: FIELD.favs, life: FIELD.lifeFavs,
    gained: "favourited", lost: "removed", lostLabel: "Unfavourited",
    churnAria: "Favourites added against favourites removed",
  },
  views: {
    key: "views", label: "Views", noun: "views",
    field: FIELD.views, life: null,
  },
};
const METRIC_LIST = [METRICS.subs, METRICS.favs, METRICS.views];
let metric = METRICS[localStorage.getItem("metric")] ?? METRICS.subs;

// Churn needs a lifetime counter. Under Views there is none, so the tile, the
// sort and the table column fall back to subscribers rather than vanishing —
// each names itself, so a subscriber figure beside a views chart still reads.
// The chart is the one place it can't fall back: a churn chart under a views
// headline would be measuring something the page isn't about.
const churnMetric = () => (metric.life ? metric : METRICS.subs);

const MODES = ["total", "stacked", "velocity", "churn", "launch"];
let heroMode = MODES.includes(localStorage.getItem("heroMode")) ? localStorage.getItem("heroMode") : "total";
let heroLog = localStorage.getItem("heroLog") === "1";

// A velocity bar is only honest if several samples fall inside it, and the poller
// records a row roughly once an hour — it writes one only when a number moves,
// with a 6h heartbeat behind that. Under a day there aren't enough samples to
// fill the bars, so the mode steps aside. `heroMode` itself is left alone:
// widening the range brings the chart straight back.
const velocityOk = () => rangeHours === 0 || rangeHours >= 24;
// Churn is bucketed the same way and so inherits the same floor.
const bucketed = (m) => m === "velocity" || m === "churn";
// Stacked steps aside under a focused mod for the same reason velocity steps
// aside under a short window: a stack of one band is just the line.
const effMode = () => {
  if (bucketed(heroMode) && !velocityOk()) return "total";
  if (heroMode === "churn" && !metric.life) return "total";
  if (heroMode === "stacked" && focused()) return "total";
  return heroMode;
};
// Hero-only, in memory only: which mod is on screen isn't worth restoring a
// week later, and a persisted hide would look like missing data.
const hiddenIds = new Set();

// The mod the whole page is scoped to, or null for all of them. It lives in the
// hash rather than localStorage so a focused view can be linked and survives a
// reload, and so leaving it is a normal back-button step.
function readFocus() {
  const m = location.hash.match(/^#mod=(\d+)$/);
  return m ? m[1] : null;
}
let focusId = readFocus();

// Always ask through this: a hash naming a mod that no longer exists has to
// behave exactly like no hash at all, not blank every figure on the page.
const focused = () => (focusId && data?.mods?.[focusId] ? focusId : null);
const scopeIds = () => (focused() ? [focused()] : data.order);

function setFocus(id) {
  focusId = id;
  const hash = id ? `#mod=${id}` : "";
  history.replaceState(null, "", location.pathname + location.search + hash);
  scrollTo({ top: 0, behavior: "smooth" });
  render();
}

// Live current numbers from api/stats.js, in history-row shape. Held in memory
// only — nothing here is ever written down, which is the point: the tiles can
// refresh every minute without anything being recorded every minute.
const LIVE_URL = "/api/stats";
const LIVE_MS = 60_000;
let live = {};
let liveAt = 0;
// Flipped off permanently the first time the endpoint isn't there, so a static
// deployment without the function degrades to history-only instead of retrying
// into the void once a minute.
let liveOn = true;

/* ---------- formatting ---------- */

const nf = new Intl.NumberFormat();

// Proportional figures do the aligning at display sizes; compact only past 10k.
function fmt(n) {
  if (n == null) return "—";
  if (Math.abs(n) >= 10_000) {
    return new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(n);
  }
  return nf.format(n);
}

const pct = (v) => (v == null ? "—" : `${(v * 100).toFixed(1)}%`);

const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });

function relTime(sec) {
  const age = Math.floor(Date.now() / 1000) - sec;
  if (age < 90) return "just now";
  for (const [div, unit] of [[86400, "day"], [3600, "hour"], [60, "minute"]]) {
    if (age >= div) return rtf.format(-Math.round(age / div), unit);
  }
  return "just now";
}

function absTime(sec) {
  return new Date(sec * 1000).toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
  });
}

// Axis ends carry only as much precision as the window needs.
function axisTime(sec) {
  const d = new Date(sec * 1000);
  return rangeHours !== 0 && rangeHours <= 24
    ? d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
    : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function ageLabel(sec) {
  if (sec < 3600) return `${Math.round(sec / 60)}m`;
  if (sec < 86400) return `${Math.round(sec / 3600)}h`;
  const d = Math.floor(sec / 86400), h = Math.round((sec % 86400) / 3600);
  return h ? `${d}d ${h}h` : `${d}d`;
}

function bucketLabel(b, sec) {
  const start = new Date(b * 1000);
  if (sec >= 86400) {
    return start.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  const end = new Date((b + sec) * 1000);
  const hm = (d) => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return `${hm(start)}–${hm(end)} · ${start.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
}

const windowLabel = () =>
  rangeHours === 0 ? "since tracking began"
    : rangeHours <= 24 ? `in ${rangeHours}h`
    : `in ${rangeHours / 24}d`;

// Since launch re-reads the range buttons as a zoom on each mod's first hours,
// so anything describing the chart's own window needs the other wording.
const launchLabel = () =>
  rangeHours === 0 ? "their whole life so far"
    : rangeHours <= 24 ? `first ${rangeHours}h`
    : `first ${rangeHours / 24} days`;

const chartWindowLabel = () => (effMode() === "launch" ? launchLabel() : windowLabel());

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// Direction is carried by an arrow glyph as well as colour — never colour alone.
function deltaParts(diff, suffix = "") {
  if (diff == null) return { dir: "flat", text: "—" };
  if (diff === 0)   return { dir: "flat", text: `No change ${suffix}`.trim() };
  return {
    dir: diff > 0 ? "up" : "down",
    text: `${diff > 0 ? "↑" : "↓"} ${fmt(Math.abs(diff))} ${suffix}`.trim(),
  };
}

function setDelta(el, diff, suffix = "") {
  const p = deltaParts(diff, suffix);
  el.dataset.dir = p.dir;
  el.textContent = p.text;
}

function deltaHtml(diff, suffix = "") {
  const p = deltaParts(diff, suffix);
  return `<span class="delta" data-dir="${p.dir}">${p.text}</span>`;
}

/* ---------- series helpers ---------- */

const rowsFor = (id) => data?.series?.[id] ?? [];

// History plus the live reading as a virtual final sample, so a chart ends
// exactly where the number above it says it does. Never written down, and
// never used by baseline(): a window comparison has to anchor to a recorded
// sample, not to a value that vanishes on reload.
function rowsLive(id) {
  const rows = rowsFor(id);
  const now = live[id];
  if (!now) return rows;
  const last = rows.at(-1);
  return last && now[0] <= last[0] ? rows : [...rows, now];
}

// Current values prefer the live reading from /api/stats. Splicing the two
// sources together here means every tile, delta and table cell picks up live
// numbers without any of the render code knowing there are two sources at all.
const latest = (id) => live[id] ?? rowsFor(id).at(-1) ?? null;

// The sample the comparison window starts from: the last one at or before the
// cutoff, else the oldest we hold (so a young mod compares against launch).
function baseline(id) {
  const rows = rowsFor(id);
  if (rows.length < 2) return null;
  if (rangeHours === 0) return rows[0];
  const cutoff = Date.now() / 1000 - rangeHours * 3600;
  let pick = null;
  for (const r of rows) { if (r[0] <= cutoff) pick = r; else break; }
  return pick ?? rows[0];
}

function totalNow(field) {
  let sum = 0, any = false;
  for (const id of scopeIds()) {
    const r = latest(id);
    if (r && r[field] != null) { sum += r[field]; any = true; }
  }
  return any ? sum : null;
}

function totalDelta(field) {
  let diff = 0, any = false;
  for (const id of scopeIds()) {
    const now = latest(id), was = baseline(id);
    if (now && was && now[field] != null && was[field] != null) { diff += now[field] - was[field]; any = true; }
  }
  return any ? diff : null;
}

// Samples are per-mod and not aligned in time, so step each mod forward
// independently across the union of timestamps. Returns each mod's stepped
// value at every stamp as well as the sum, which is what lets the stacked
// bands and the total curve share one pass.
function alignedSeries(ids) {
  const rows = Object.fromEntries(ids.map((id) => [id, rowsLive(id)]));
  const stamps = new Set();
  for (const id of ids) for (const r of rows[id]) stamps.add(r[0]);
  const sorted = [...stamps].sort((a, b) => a - b);

  const cursor = {}, held = {}, values = {};
  for (const id of ids) { cursor[id] = 0; held[id] = null; values[id] = []; }

  const total = [];
  for (const t of sorted) {
    let sum = 0;
    for (const id of ids) {
      const rs = rows[id];
      while (cursor[id] < rs.length && rs[cursor[id]][0] <= t) held[id] = rs[cursor[id]++];
      const v = held[id] ? held[id][metric.field] : 0;
      values[id].push(v);
      sum += v;
    }
    total.push(sum);
  }
  return { stamps: sorted, values, total };
}

function totalSeries(ids = data.order) {
  const { stamps, total } = alignedSeries(ids);
  return stamps.map((t, i) => [t, total[i]]);
}

// ~24-30 bars per window, so velocity is never a comb or four blocks. Sub-day
// windows never reach here — velocityOk() gates the mode out first.
const bucketSec = (hours) => (hours === 24 ? 3600 : hours === 168 ? 21600 : 86400);

// Gains per bucket: the last value in the bucket minus the last value at or
// before its start. A bucket with no prior sample — the mod's history starts
// mid-range — is skipped rather than drawn as a zero it can't stand behind.
function velocity(id, from, to, sec) {
  const rows = rowsLive(id);
  if (rows.length < 2) return [];
  const last = rows.at(-1)[0];
  const start = Math.floor(from / sec) * sec;

  let i = 0, held = null;
  while (i < rows.length && rows[i][0] <= start) held = rows[i++];

  const out = [];
  for (let b = start; b < to; b += sec) {
    const prior = held;
    while (i < rows.length && rows[i][0] <= b + sec) held = rows[i++];
    if (!prior || b > last) continue;
    out.push([b, held[metric.field] - prior[metric.field], b + sec > last]);
  }
  return out;
}

// Joins and departures per bucket. Steam publishes no leave counter, but it
// publishes both a lifetime total and a current one: everyone who ever counted,
// against what stuck. The gap between the two deltas is the only place a page
// can see someone leave at all.
// Both sides are floored at zero — a lifetime counter that steps backwards is
// Steam correcting itself, not a negative crowd of subscribers.
function flow(id, from, to, sec, m = metric) {
  const rows = rowsLive(id);
  if (rows.length < 2 || !m.life) return [];
  const last = rows.at(-1)[0];
  const start = Math.floor(from / sec) * sec;

  let i = 0, held = null;
  while (i < rows.length && rows[i][0] <= start) held = rows[i++];

  const out = [];
  for (let b = start; b < to; b += sec) {
    const prior = held;
    while (i < rows.length && rows[i][0] <= b + sec) held = rows[i++];
    if (!prior || b > last) continue;
    if (prior[m.life] == null || held[m.life] == null) continue;
    const joined = Math.max(0, held[m.life] - prior[m.life]);
    const net = held[m.field] - prior[m.field];
    out.push([b, joined, Math.max(0, joined - net), b + sec > last]);
  }
  return out;
}

// The same decomposition over the comparison window rather than per bucket, for
// the tile, the table and the sort.
function churnOf(id, m = churnMetric()) {
  const now = latest(id), was = baseline(id);
  if (!m.life || !now || !was || now[m.life] == null || was[m.life] == null) return null;
  const joined = Math.max(0, now[m.life] - was[m.life]);
  const net = now[m.field] - was[m.field];
  return { joined, net, lost: Math.max(0, joined - net) };
}

function churnWindow(m = churnMetric()) {
  let joined = 0, lost = 0, any = false;
  for (const id of scopeIds()) {
    const c = churnOf(id, m);
    if (!c) continue;
    joined += c.joined; lost += c.lost; any = true;
  }
  return any ? { joined, lost } : null;
}

// x is age at the sample, not wall-clock, so launches line up on day zero.
function sinceLaunch(id) {
  const created = data.mods?.[id]?.created;
  if (!created) return [];
  return rowsLive(id).map((r) => [r[0] - created, r[metric.field]]);
}

// Workshop edits the poller has seen, as Steam's own `time_updated`. Labelled
// only "Updated": that stamp moves on any edit, so a description tweak is
// indistinguishable from a code release and the label mustn't imply otherwise.
const eventsFor = (id) => data?.events?.[id] ?? [];

// The metric at the last sample on or before t.
function valueAt(rows, t) {
  let v = null;
  for (const r of rows) { if (r[0] <= t) v = r[metric.field]; else break; }
  return v;
}

// What an edit was followed by: the metric gained in the span after it
// against the same span before. The span shrinks for a recent edit so the two
// sides stay equal — an hour of "after" compared against two days of "before"
// would read as a collapse every time.
// This is an observation, never a cause: `time_updated` moves on any edit, and
// nothing here separates the edit from whatever else happened that day.
const IMPACT_H = 48;

function impact(id, t) {
  const rows = rowsLive(id);
  if (rows.length < 2) return null;
  const span = Math.min(IMPACT_H * 3600, rows.at(-1)[0] - t);
  // Most seeded events predate the first sample, so the two silent cases are the
  // common ones — they say why rather than looking like a broken measurement.
  if (span < 3600) return { note: "too recent to measure" };
  if (t - span < rows[0][0]) return { note: "nothing recorded before this edit" };
  const a = valueAt(rows, t - span), b = valueAt(rows, t), c = valueAt(rows, t + span);
  if (a == null || b == null || c == null) return null;
  return { before: b - a, after: c - b, span };
}

function ratingOf(row) {
  if (!row || row[FIELD.up] == null) return null;
  const up = row[FIELD.up], down = row[FIELD.down] ?? 0;
  return { up, down, total: up + down, pct: up + down ? up / (up + down) : null };
}

function ratio(id, num, den) {
  const row = latest(id);
  if (!row || !row[den]) return null;
  return row[num] / row[den];
}

// Both pills are the active metric over a denominator, and each exists only
// where its denominator does: keep needs a lifetime counter, conversion needs
// page views to be something other than the metric itself.
const keepOf = (id) => (metric.life ? ratio(id, metric.field, metric.life) : null);
const convOf = (id) => (metric === METRICS.views ? null : ratio(id, metric.field, FIELD.views));
const keepHelp = () => `${metric.label} still holding, out of everyone who ever ${metric.gained}`;
const convHelp = () => `${metric.label} per page view`;

/* ---------- self-calibrating bands ---------- */

// Keep-rate and conversion have no external benchmark — what counts as healthy
// depends on the mod's niche, its age, and how its page is reached — so a pill is
// banded against this set's own spread rather than a threshold invented here.
// Below four mods, or a set that agrees to within half a point, nothing is banded
// at all: too little to say anything with.
const CAL_MIN = 4;

function calibrate(values) {
  const v = values.filter((x) => x != null);
  if (v.length < CAL_MIN) return null;
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length);
  return sd > 0.005 ? { mean, sd, n: v.length } : null;
}

const calBand = (cal, x) =>
  !cal || x == null ? ""
    : x >= cal.mean + cal.sd ? "high"
    : x <= cal.mean - cal.sd ? "low"
    : "";

/* ---------- sorting ---------- */

// The three stock sorts stay literal — each names the column it reads, so it can
// never disagree with the chart, only differ from it deliberately. The derived
// sorts have no column of their own and follow the active metric instead.
// `ok` gates out a sort with nothing behind it, the way the mode buttons gate:
// an option that silently does nothing is worse than no option.
const SORTS = {
  subs:   { label: () => "Subscribers", dir: "desc", value: (id) => latest(id)?.[FIELD.subs] ?? null },
  favs:   { label: () => "Favourites",  dir: "desc", value: (id) => latest(id)?.[FIELD.favs] ?? null },
  views:  { label: () => "Views",       dir: "desc", value: (id) => latest(id)?.[FIELD.views] ?? null },
  // Key stays `movers`: it is the stored sort preference and the table header's
  // data-metric, neither of which the reader ever sees.
  movers: { label: () => "Change",      dir: "desc", value: (id) => {
    const now = latest(id), was = baseline(id);
    return now && was ? now[metric.field] - was[metric.field] : null;
  } },
  left:   { label: () => churnMetric().lostLabel, dir: "desc", value: (id) => churnOf(id)?.lost ?? null },
  keep:   { label: () => "Keep-rate",   dir: "desc", value: keepOf, ok: () => !!metric.life },
  conv:   { label: () => "Conversion",  dir: "desc", value: convOf, ok: () => metric !== METRICS.views },
  newest: { label: () => "Newest",      dir: "desc", value: (id) => data.mods?.[id]?.created ?? null },
};

const sortOk = (key) => !!SORTS[key] && SORTS[key].ok?.() !== false;

function readSort() {
  try {
    const s = JSON.parse(localStorage.getItem("sortBy") ?? "");
    if (SORTS[s?.metric] && (s.dir === "asc" || s.dir === "desc")) return s;
  } catch { /* fall through to the default */ }
  return { metric: "subs", dir: "desc" };
}
let sort = readSort();

// A sort the current metric can't answer steps aside for that metric's own
// column, exactly as a gated-out chart mode falls back to Total. `sort` itself
// is left alone, so switching back restores the reader's pick.
const effSort = () => (sortOk(sort.metric) ? sort : { metric: metric.key, dir: "desc" });

// Drives the cards and the table only. The stacked chart keeps publish order:
// re-sorting bands would move every layer below a mover and show motion that
// isn't growth.
function sortedIds() {
  if (focused()) return [focused()];
  const active = effSort();
  const spec = SORTS[active.metric] ?? SORTS.subs;
  const sign = active.dir === "asc" ? 1 : -1;
  const idx = new Map(data.order.map((id, i) => [id, i]));
  return [...data.order].sort((a, b) => {
    const va = spec.value(a), vb = spec.value(b);
    if (va == null || vb == null) {
      if (va == null && vb == null) return idx.get(a) - idx.get(b);
      return va == null ? 1 : -1;                      // nulls last both ways
    }
    return va === vb ? idx.get(a) - idx.get(b) : (va - vb) * sign;
  });
}

function setSort(key, flip, redraw = true) {
  if (!SORTS[key]) return;
  // Flips from what the reader can actually see, which is the effective sort —
  // reversing a fallback has to reverse the fallback, not the pick behind it.
  const cur = effSort();
  sort = key === cur.metric && flip
    ? { metric: key, dir: cur.dir === "asc" ? "desc" : "asc" }
    : { metric: key, dir: SORTS[key].dir };
  localStorage.setItem("sortBy", JSON.stringify(sort));
  if (redraw) render();
}

function setMetric(key) {
  if (!METRICS[key] || METRICS[key] === metric) return;
  const prev = metric;
  metric = METRICS[key];
  localStorage.setItem("metric", key);
  // A sort resting on the old metric's own column moves to the new one's. Any
  // other column the reader picked is a deliberate cross-reference and stays.
  if (sort.metric === prev.key) setSort(key, false, false);
  render();
}

/* ---------- chart primitives ----------
   Drawn in real pixels off a measured container width, so strokes and end-dots
   keep their geometry instead of being scaled by a viewBox. */

const PAD = { x: 8, top: 10, bottom: 12 };

const scaleX = (t0, t1, width) => (t) =>
  PAD.x + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (width - 2 * PAD.x);

// Log clamps the floor to 1 so a zero reading can't blow up the scale.
function scaleY(lo, hi, height, log) {
  const top = PAD.top, bot = height - PAD.bottom;
  if (log) {
    const l0 = Math.log10(Math.max(1, lo));
    const l1 = Math.log10(Math.max(hi, Math.max(1, lo) * 1.05));
    return (v) => bot - ((Math.log10(Math.max(v, Math.max(1, lo))) - l0) / (l1 - l0)) * (bot - top);
  }
  let a = lo, b = hi;
  if (a === b) { b += 1; a -= 1; }
  return (v) => bot - ((v - a) / (b - a)) * (bot - top);
}

const path = (pts) =>
  pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");

// Update annotations: short ticks at the baseline rather than full-height
// rules, which is what keeps them readable over a stacked area and inside a
// 62px card sparkline. Drawn last so they sit above the fills. The second,
// invisible line is the hit target — a 2px tick is not something you can point
// at on a phone.
function rugMarks(marks, height) {
  const base = height - PAD.bottom, top = base - 7;
  return marks.map((m) => `<g>
      <line x1="${m.x.toFixed(1)}" y1="${top}" x2="${m.x.toFixed(1)}" y2="${base}"
            stroke="${m.color}" stroke-width="2" stroke-linecap="round"/>
      <line x1="${m.x.toFixed(1)}" y1="${(top - 5).toFixed(1)}" x2="${m.x.toFixed(1)}" y2="${base}"
            stroke="transparent" stroke-width="11"><title>${m.label}</title></line>
    </g>`).join("");
}

// Second line only once both sides of the comparison exist — an edit with no
// recorded history behind it gets the stamp alone rather than a measurement
// standing on one sample.
function rugLabel(t, name, id) {
  const head = `Updated${name ? ` · ${name}` : ""} · ${absTime(t)}`;
  const im = id ? impact(id, t) : null;
  if (!im) return head;
  if (im.note) return `${head}\n${im.note}`;
  const sign = (n) => `${n >= 0 ? "+" : "−"}${fmt(Math.abs(n))}`;
  const w = ageLabel(im.span);
  return `${head}\n${sign(im.after)} in the ${w} after · ${sign(im.before)} in the ${w} before`;
}

// The crosshair, marker and tooltip, shared by the card sparklines and every
// hero mode. hits are {x, y, ...}; format turns one into tooltip HTML.
function attachProbe(host, svg, hits, format, opts = {}) {
  if (!hits.length) return;
  const NS = "http://www.w3.org/2000/svg";
  const width = Number(svg.getAttribute("width"));
  const height = Number(svg.getAttribute("height"));

  const cross = document.createElementNS(NS, "line");
  cross.setAttribute("y1", String(PAD.top - 4));
  cross.setAttribute("y2", String(height - PAD.bottom));
  cross.setAttribute("stroke", "var(--muted)");
  cross.setAttribute("stroke-width", "1");
  cross.setAttribute("opacity", "0");
  svg.appendChild(cross);

  const dot = document.createElementNS(NS, "circle");
  dot.setAttribute("r", "4.5");
  dot.setAttribute("stroke", "var(--surface)");
  dot.setAttribute("stroke-width", "2");
  dot.setAttribute("opacity", "0");
  if (opts.dot !== false) svg.appendChild(dot);

  const tip = document.createElement("div");
  tip.className = "tip";
  host.appendChild(tip);

  // 0 picks by x alone (one line, or a stack read at its top); 1 picks in two
  // dimensions, which is the only way to hover one line out of seven.
  const yw = opts.yWeight ?? 0;

  const move = (clientX, clientY) => {
    const box = svg.getBoundingClientRect();
    const px = clientX - box.left, py = clientY - box.top;
    let best = 0, bestD = Infinity;
    for (let i = 0; i < hits.length; i++) {
      const dx = hits[i].x - px, dy = (hits[i].y - py) * yw;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    const h = hits[best];
    cross.setAttribute("x1", h.x); cross.setAttribute("x2", h.x);
    cross.setAttribute("opacity", "1");
    if (opts.dot !== false) {
      dot.setAttribute("cx", h.x); dot.setAttribute("cy", h.y);
      dot.setAttribute("fill", h.color ?? "var(--s1)");
      dot.setAttribute("opacity", "1");
    }
    tip.innerHTML = format(h);
    tip.style.opacity = "1";
    const halfW = tip.offsetWidth / 2 + 2;
    tip.style.left = `${Math.min(Math.max(h.x, halfW), Math.max(width - halfW, halfW))}px`;
    tip.style.top = `${Math.max(h.y - 8, tip.offsetHeight + 2)}px`;
  };
  const clear = () => {
    cross.setAttribute("opacity", "0");
    dot.setAttribute("opacity", "0");
    tip.style.opacity = "0";
  };

  svg.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  svg.addEventListener("pointerdown", (e) => move(e.clientX, e.clientY));
  svg.addEventListener("pointerleave", clear);
}

function emptyChart(host, height, msg) {
  host.innerHTML = `<div class="spark-empty"${height ? ` style="height:${height}px"` : ""}>${msg}</div>`;
}

/* ---------- sparklines (cards) ---------- */

function sparkline(host, points, colorVar, opts = {}) {
  const height = opts.height ?? 62;
  const width = host.clientWidth;

  if (points.length < 2 || width < 40) {
    host.innerHTML = `<div class="spark-empty">${
      width < 40 ? "" : "Collecting history — the trend appears after the next change"
    }</div>`;
    return;
  }

  const t0 = points[0][0], t1 = points.at(-1)[0];
  const lo = Math.min(...points.map((p) => p[1]));
  const hi = Math.max(...points.map((p) => p[1]));
  const X = scaleX(t0, t1, width);
  const Y = scaleY(lo, hi, height, false);

  const pts = points.map((p) => [X(p[0]), Y(p[1])]);
  const line = path(pts);
  const area = `${line} L${pts.at(-1)[0].toFixed(1)} ${height - PAD.bottom} L${pts[0][0].toFixed(1)} ${height - PAD.bottom} Z`;
  const [ex, ey] = pts.at(-1);
  const c = `var(${colorVar})`;
  const noun = opts.noun ?? metric.noun;

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="${opts.label ?? "Trend"}: ${fmt(points[0][1])} on ${absTime(t0)} to ${fmt(points.at(-1)[1])} now">
      <path d="${area}" fill="${c}" fill-opacity="0.10"/>
      <path d="${line}" fill="none" stroke="${c}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4"
              fill="${c}" stroke="var(--surface)" stroke-width="2"/>
      ${rugMarks((opts.rug ?? []).filter((t) => t >= t0 && t <= t1)
        .map((t) => ({ x: X(t), color: c, label: rugLabel(t, null, opts.id) })), height)}
      <text class="spark-note" x="${width - 2}" y="${height - 1}" text-anchor="end">${fmt(lo)} → ${fmt(hi)}</text>
    </svg>`;

  attachProbe(host, host.querySelector("svg"),
    points.map((p, i) => ({ x: pts[i][0], y: pts[i][1], color: c, t: p[0], v: p[1] })),
    (h) => `<b>${fmt(h.v)}</b> ${noun}<span class="tip-t">${absTime(h.t)}</span>`);
}

// Bars share the sparkline's footprint so a card doesn't jump height when the
// hero switches to Velocity.
function sparkbars(host, buckets, colorVar, sec, opts = {}) {
  const height = opts.height ?? 62;
  const width = host.clientWidth;

  if (!buckets.length || width < 40) {
    host.innerHTML = `<div class="spark-empty">${
      width < 40 ? "" : "Collecting history — the trend appears after the next change"
    }</div>`;
    return;
  }

  const lo = Math.min(0, ...buckets.map((b) => b[1]));
  const hi = Math.max(0, ...buckets.map((b) => b[1]));
  const Y = scaleY(lo, hi === lo ? lo + 1 : hi, height, false);
  const slot = (width - 2 * PAD.x) / buckets.length;
  const bw = Math.max(1.5, slot * 0.72);
  const c = `var(${colorVar})`;
  const zero = Y(0);

  const idx = new Map(buckets.map(([b], i) => [b, i]));
  const rug = (opts.rug ?? [])
    .map((t) => [t, idx.get(Math.floor(t / sec) * sec)])
    .filter(([, i]) => i !== undefined)
    .map(([t, i]) => ({ x: PAD.x + (i + 0.5) * slot, color: c, label: rugLabel(t, null, opts.id) }));

  const bars = buckets.map(([b, gain, partial], i) => {
    const cx = PAD.x + (i + 0.5) * slot;
    const y = Y(gain);
    return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Math.min(y, zero).toFixed(1)}"
                  width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y - zero)).toFixed(1)}"
                  rx="1" fill="${c}" fill-opacity="${partial ? 0.3 : 0.85}"/>`;
  }).join("");

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="${opts.label ?? "Rate"}: up to ${fmt(hi)} new ${opts.noun ?? metric.noun} per ${
           sec >= 86400 ? "day" : `${sec / 3600} hours`}">
      ${lo < 0 ? `<line x1="${PAD.x}" y1="${zero.toFixed(1)}" x2="${width - PAD.x}" y2="${zero.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>` : ""}
      ${bars}
      ${rugMarks(rug, height)}
      <text class="spark-note" x="${width - 2}" y="${height - 1}" text-anchor="end">peak +${fmt(hi)}</text>
    </svg>`;

  attachProbe(host, host.querySelector("svg"),
    buckets.map(([b, gain, partial], i) => ({
      x: PAD.x + (i + 0.5) * slot, y: Y(gain), color: c, b, gain, partial,
    })),
    (h) => `<b>${h.gain >= 0 ? "+" : "−"}${fmt(Math.abs(h.gain))}</b> ${opts.noun ?? metric.noun}${
      h.partial ? " so far" : ""}<span class="tip-t">${bucketLabel(h.b, sec)}</span>`,
    { dot: false });
}

// Joins up, departures down, off a shared zero. Departures are drawn in the
// mod's own colour at a lower opacity rather than in the loss red: red here
// would read as a warning, and a healthy mod sheds subscribers every day.
function sparkflow(host, buckets, colorVar, sec, opts = {}) {
  const height = opts.height ?? 62;
  const width = host.clientWidth;

  if (!buckets.length || width < 40) {
    host.innerHTML = `<div class="spark-empty">${
      width < 40 ? "" : "Collecting history — joins and departures need a full window"
    }</div>`;
    return;
  }

  const hi = Math.max(1, ...buckets.map((b) => b[1]));
  const lo = -Math.max(0, ...buckets.map((b) => b[2]));
  const Y = scaleY(lo, hi, height, false);
  const slot = (width - 2 * PAD.x) / buckets.length;
  const bw = Math.max(1.5, slot * 0.72);
  const c = `var(${colorVar})`;
  const zero = Y(0);

  const idx = new Map(buckets.map(([b], i) => [b, i]));
  const rug = (opts.rug ?? [])
    .map((t) => [t, idx.get(Math.floor(t / sec) * sec)])
    .filter(([, i]) => i !== undefined)
    .map(([t, i]) => ({ x: PAD.x + (i + 0.5) * slot, color: c, label: rugLabel(t, null, opts.id) }));

  const bar = (cx, y0, y1, o, partial) =>
    `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}"
           width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}"
           rx="1" fill="${c}" fill-opacity="${partial ? o * 0.4 : o}"/>`;

  const bars = buckets.map(([b, joined, lost, partial], i) => {
    const cx = PAD.x + (i + 0.5) * slot;
    return bar(cx, zero, Y(joined), 0.85, partial) + (lost ? bar(cx, zero, Y(-lost), 0.4, partial) : "");
  }).join("");

  const totJoined = buckets.reduce((a, b) => a + b[1], 0);
  const totLost = buckets.reduce((a, b) => a + b[2], 0);

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="${opts.label ?? "Churn"}: ${fmt(totJoined)} ${metric.gained}, ${fmt(totLost)} ${metric.lost}, per ${
           sec >= 86400 ? "day" : `${sec / 3600} hours`}">
      <line x1="${PAD.x}" y1="${zero.toFixed(1)}" x2="${width - PAD.x}" y2="${zero.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      ${bars}
      ${rugMarks(rug, height)}
      <text class="spark-note" x="${width - 2}" y="${height - 1}" text-anchor="end">+${fmt(totJoined)} · −${fmt(totLost)}</text>
    </svg>`;

  attachProbe(host, host.querySelector("svg"),
    buckets.map(([b, joined, lost, partial], i) => ({
      x: PAD.x + (i + 0.5) * slot, y: Y(joined), color: c, b, joined, lost, partial,
    })),
    (h) => `<b>+${fmt(h.joined)}</b> ${metric.gained} · <b>−${fmt(h.lost)}</b> ${metric.lost}${
      h.partial ? " so far" : ""}<span class="tip-t">${bucketLabel(h.b, sec)}</span>`,
    { dot: false });
}

/* ---------- hero chart ---------- */

// Publish order — never `slot`, which is only the order mods.json was edited in
// (Book Tracker predates Turn Off Fridges but sits at slot 2), and never the
// sort, which the reader can change under a chart that must not move.
const createdOrder = () =>
  [...data.order].filter((id) => data.mods?.[id]).sort(
    (a, b) => (data.mods[a].created ?? 0) - (data.mods[b].created ?? 0));

const heroIds = () => (focused() ? [focused()] : createdOrder().filter((id) => !hiddenIds.has(id)));

const colorOf = (id) => `var(${SLOT_VAR[data.mods?.[id]?.slot] ?? "--s1"})`;
const shortOf = (id) => data.mods?.[id]?.short ?? id;

const heroHeight = () => (innerWidth <= 620 ? 140 : 180);

// Events on a linear time axis. `at` maps a timestamp to a chart x — which in
// Since launch is the mod's age at that moment, not wall-clock.
function timeRug(ids, inRange, at) {
  const out = [];
  for (const id of ids) {
    for (const t of eventsFor(id)) {
      if (!inRange(t, id)) continue;
      out.push({ x: at(t, id), color: colorOf(id), label: rugLabel(t, shortOf(id), id) });
    }
  }
  return out;
}

// Velocity's x is a bucket index, not a time, so an event lands under the bar
// of the bucket it happened in or nowhere at all.
function bucketRug(ids, buckets, sec, at) {
  const idx = new Map(buckets.map((b, i) => [b, i]));
  const out = [];
  for (const id of ids) {
    for (const t of eventsFor(id)) {
      const i = idx.get(Math.floor(t / sec) * sec);
      if (i === undefined) continue;
      out.push({ x: at(i), color: colorOf(id), label: rugLabel(t, shortOf(id), id) });
    }
  }
  return out;
}

function axisEnds(left, right) {
  const el = document.getElementById("hero-axis");
  el.innerHTML = `<span>${left}</span><span>${right}</span>`;
}

// One row per mod under the headline figure in a stacked or bucketed tooltip.
function breakdown(parts) {
  const rows = parts
    .filter((p) => p.v)
    .sort((a, b) => Math.abs(b.v) - Math.abs(a.v))
    .map((p) => `<div class="tip-row"><span class="swatch" style="background:${p.color}"></span>${
      p.name}<span>${p.sign && p.v > 0 ? "+" : ""}${fmt(p.v)}</span></div>`)
    .join("");
  return rows ? `<div class="tip-rule"></div>${rows}` : "";
}

function renderHeroChart() {
  const host = document.getElementById("hero-spark");
  const width = host.clientWidth;
  const height = heroHeight();
  document.getElementById("hero-axis").innerHTML = "";
  if (width < 40) { host.innerHTML = ""; return; }

  const mode = effMode();
  const ids = heroIds();
  if (mode !== "total" && !ids.length) {
    emptyChart(host, height, "Every mod is hidden — pick one from the legend below");
    return;
  }

  const nowSec = Math.max(Date.now() / 1000, ...data.order.map((id) => rowsLive(id).at(-1)?.[0] ?? 0));
  const cutoff = rangeHours === 0 ? 0 : nowSec - rangeHours * 3600;

  if (mode === "stacked") drawStacked(host, width, height, ids, cutoff);
  else if (mode === "velocity") drawVelocity(host, width, height, ids, cutoff, nowSec);
  else if (mode === "churn") drawChurn(host, width, height, ids, cutoff, nowSec);
  else if (mode === "launch") drawLaunch(host, width, height, ids);
  else drawTotal(host, width, height, cutoff);
}

function drawTotal(host, width, height, cutoff) {
  const scope = scopeIds();
  const agg = totalSeries(scope);
  let pts = agg.filter((p) => p[0] >= cutoff);
  if (pts.length < 2) pts = agg;
  if (pts.length < 2) {
    emptyChart(host, height, "Collecting history — the trend appears after the next change");
    return;
  }

  const t0 = pts[0][0], t1 = pts.at(-1)[0];
  const X = scaleX(t0, t1, width);
  const Y = scaleY(Math.min(...pts.map((p) => p[1])), Math.max(...pts.map((p) => p[1])), height, heroLog);
  const xy = pts.map((p) => [X(p[0]), Y(p[1])]);
  const line = path(xy);
  const area = `${line} L${xy.at(-1)[0].toFixed(1)} ${height - PAD.bottom} L${xy[0][0].toFixed(1)} ${height - PAD.bottom} Z`;
  const c = focused() ? colorOf(focused()) : "var(--s1)";
  const who = focused() ? `${shortOf(focused())} ${metric.noun}` : `Total ${metric.noun}`;

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="${who} ${chartWindowLabel()}: ${fmt(pts[0][1])} to ${fmt(pts.at(-1)[1])}${heroLog ? ", logarithmic scale" : ""}">
      <path d="${area}" fill="${c}" fill-opacity="0.10"/>
      <path d="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${xy.at(-1)[0].toFixed(1)}" cy="${xy.at(-1)[1].toFixed(1)}" r="4"
              fill="${c}" stroke="var(--surface)" stroke-width="2"/>
      ${rugMarks(timeRug(scope, (t) => t >= t0 && t <= t1, X), height)}
    </svg>`;

  attachProbe(host, host.querySelector("svg"),
    pts.map((p, i) => ({ x: xy[i][0], y: xy[i][1], color: c, t: p[0], v: p[1] })),
    (h) => `<b>${fmt(h.v)}</b> ${metric.noun}<span class="tip-t">${absTime(h.t)}</span>`);

  axisEnds(axisTime(t0), "now");
}

function drawStacked(host, width, height, ids, cutoff) {
  const { stamps, values, total } = alignedSeries(ids);
  let from = stamps.findIndex((t) => t >= cutoff);
  if (from < 0 || stamps.length - from < 2) from = 0;
  const ts = stamps.slice(from);
  if (ts.length < 2) {
    emptyChart(host, height, "Collecting history — the trend appears after the next change");
    return;
  }

  const X = scaleX(ts[0], ts.at(-1), width);
  const cols = Object.fromEntries(ids.map((id) => [id, values[id].slice(from)]));
  const tops = [];
  const running = new Array(ts.length).fill(0);
  for (const id of ids) {
    tops.push(cols[id].map((v, i) => (running[i] += v)));
  }
  const sums = total.slice(from);
  const Y = scaleY(0, Math.max(...sums), height, false);

  let body = "";
  let below = new Array(ts.length).fill(0);
  ids.forEach((id, k) => {
    const c = colorOf(id);
    const top = tops[k].map((v, i) => [X(ts[i]), Y(v)]);
    const bot = below.map((v, i) => [X(ts[i]), Y(v)]).reverse();
    body += `<path d="${path(top)} ${bot.map(([x, y]) => `L${x.toFixed(1)} ${y.toFixed(1)}`).join(" ")} Z"
                   fill="${c}" fill-opacity="0.45"/>
             <path d="${path(top)}" fill="none" stroke="${c}" stroke-width="1.5"
                   stroke-linejoin="round"/>`;
    below = tops[k];
  });

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="${metric.label} by mod, stacked in publish order, ${chartWindowLabel()}. Total ${fmt(sums.at(-1))}.">
      ${body}
      ${rugMarks(timeRug(ids, (t) => t >= ts[0] && t <= ts.at(-1), X), height)}
    </svg>`;

  attachProbe(host, host.querySelector("svg"),
    ts.map((t, i) => ({ x: X(t), y: Y(sums[i]), color: "var(--ink-2)", t, i })),
    (h) => `<b>${fmt(sums[h.i])}</b> ${metric.noun}<span class="tip-t">${absTime(h.t)}</span>` +
      breakdown(ids.map((id) => ({ name: shortOf(id), color: colorOf(id), v: cols[id][h.i] }))));

  axisEnds(axisTime(ts[0]), "now");
}

function drawVelocity(host, width, height, ids, cutoff, nowSec) {
  const sec = bucketSec(rangeHours);
  const earliest = Math.min(...ids.map((id) => rowsLive(id)[0]?.[0] ?? Infinity));
  const from = rangeHours === 0 ? (Number.isFinite(earliest) ? earliest : nowSec) : cutoff;

  const gains = {};
  const partial = new Set();
  const starts = new Set();
  for (const id of ids) {
    const m = new Map();
    for (const [b, g, p] of velocity(id, from, nowSec, sec)) {
      m.set(b, g);
      starts.add(b);
      if (p) partial.add(b);
    }
    gains[id] = m;
  }
  const buckets = [...starts].sort((a, b) => a - b);
  if (!buckets.length) {
    emptyChart(host, height, "Collecting history — rate appears once a window has two samples");
    return;
  }

  // Positive and negative gains stack away from a shared zero line, so a mod
  // losing ground isn't quietly folded into the ones gaining it.
  let hi = 0, lo = 0;
  for (const b of buckets) {
    let up = 0, down = 0;
    for (const id of ids) {
      const g = gains[id].get(b) ?? 0;
      if (g >= 0) up += g; else down += g;
    }
    hi = Math.max(hi, up); lo = Math.min(lo, down);
  }

  const Y = scaleY(lo, hi === lo ? hi + 1 : hi, height, false);
  const zero = Y(0);
  const slot = (width - 2 * PAD.x) / buckets.length;
  const bw = Math.max(1.5, slot * 0.72);

  let body = "";
  const hits = [];
  buckets.forEach((b, i) => {
    const cx = PAD.x + (i + 0.5) * slot;
    let up = 0, down = 0, segs = "";
    for (const id of ids) {
      const g = gains[id].get(b) ?? 0;
      if (!g) continue;
      const y0 = g >= 0 ? Y(up) : Y(down);
      if (g >= 0) up += g; else down += g;
      const y1 = g >= 0 ? Y(up) : Y(down);
      segs += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}"
                     width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}"
                     fill="${colorOf(id)}"/>`;
    }
    if (!segs) {
      segs = `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(zero - 1).toFixed(1)}"
                    width="${bw.toFixed(1)}" height="1" fill="var(--grid)"/>`;
    }
    body += `<g opacity="${partial.has(b) ? 0.35 : 0.9}">${segs}</g>`;
    hits.push({ x: cx, y: Y(up), b, up, down, partial: partial.has(b) });
  });

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="New ${metric.noun} per ${sec >= 86400 ? "day" : `${sec / 3600} hours`} by mod, ${chartWindowLabel()}. Peak ${fmt(hi)}.">
      ${lo < 0 ? `<line x1="${PAD.x}" y1="${zero.toFixed(1)}" x2="${width - PAD.x}" y2="${zero.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>` : ""}
      ${body}
      ${rugMarks(bucketRug(ids, buckets, sec, (i) => PAD.x + (i + 0.5) * slot), height)}
    </svg>`;

  attachProbe(host, host.querySelector("svg"), hits,
    (h) => {
      const net = h.up + h.down;
      return `<b>${net >= 0 ? "+" : "−"}${fmt(Math.abs(net))}</b> ${metric.noun}${h.partial ? " so far" : ""}` +
        `<span class="tip-t">${bucketLabel(h.b, sec)}</span>` +
        breakdown(ids.map((id) => ({ name: shortOf(id), color: colorOf(id), v: gains[id].get(h.b) ?? 0, sign: true })));
    },
    { dot: false });

  axisEnds(axisTime(buckets[0]), "now");
}

// Velocity answers "how fast"; this answers "out of how many". A bucket whose
// join bar is tall and whose net line sits low is a mod being found and dropped
// in the same day — motion the net curve alone hides completely.
function drawChurn(host, width, height, ids, cutoff, nowSec) {
  const sec = bucketSec(rangeHours);
  const earliest = Math.min(...ids.map((id) => rowsLive(id)[0]?.[0] ?? Infinity));
  const from = rangeHours === 0 ? (Number.isFinite(earliest) ? earliest : nowSec) : cutoff;

  const joins = {}, losses = {};
  const partial = new Set(), starts = new Set();
  for (const id of ids) {
    const j = new Map(), l = new Map();
    for (const [b, joined, lost, p] of flow(id, from, nowSec, sec)) {
      j.set(b, joined); l.set(b, lost);
      starts.add(b);
      if (p) partial.add(b);
    }
    joins[id] = j; losses[id] = l;
  }
  const buckets = [...starts].sort((a, b) => a - b);
  if (!buckets.length) {
    emptyChart(host, height, "Collecting history — joins and departures need a full window");
    return;
  }

  let hi = 0, lo = 0;
  const totals = new Map();
  for (const b of buckets) {
    let up = 0, down = 0;
    for (const id of ids) { up += joins[id].get(b) ?? 0; down += losses[id].get(b) ?? 0; }
    totals.set(b, { up, down });
    hi = Math.max(hi, up); lo = Math.min(lo, -down);
  }

  const Y = scaleY(lo, hi === lo ? hi + 1 : hi, height, false);
  const zero = Y(0);
  const slot = (width - 2 * PAD.x) / buckets.length;
  const bw = Math.max(1.5, slot * 0.72);

  let body = "";
  const hits = [], netPts = [];
  buckets.forEach((b, i) => {
    const cx = PAD.x + (i + 0.5) * slot;
    let up = 0, down = 0, segs = "";
    // Joins stack up and departures stack down in the same publish order, so a
    // mod keeps its band position on both sides of the axis.
    for (const id of ids) {
      const g = joins[id].get(b) ?? 0;
      if (!g) continue;
      const y0 = Y(up); up += g;
      segs += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Y(up).toFixed(1)}"
                     width="${bw.toFixed(1)}" height="${Math.max(1, y0 - Y(up)).toFixed(1)}"
                     fill="${colorOf(id)}"/>`;
    }
    for (const id of ids) {
      const g = losses[id].get(b) ?? 0;
      if (!g) continue;
      const y0 = Y(-down); down += g;
      segs += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y0.toFixed(1)}"
                     width="${bw.toFixed(1)}" height="${Math.max(1, Y(-down) - y0).toFixed(1)}"
                     fill="${colorOf(id)}" fill-opacity="0.4"/>`;
    }
    if (!segs) {
      segs = `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(zero - 1).toFixed(1)}"
                    width="${bw.toFixed(1)}" height="1" fill="var(--grid)"/>`;
    }
    body += `<g opacity="${partial.has(b) ? 0.35 : 0.9}">${segs}</g>`;
    netPts.push([cx, Y(up - down)]);
    hits.push({ x: cx, y: Y(up), b, up, down, partial: partial.has(b) });
  });

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="${metric.churnAria} per ${
           sec >= 86400 ? "day" : `${sec / 3600} hours`}, ${chartWindowLabel()}. Peak ${fmt(hi)} gained.">
      <line x1="${PAD.x}" y1="${zero.toFixed(1)}" x2="${width - PAD.x}" y2="${zero.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      ${body}
      ${netPts.length > 1 ? `<path d="${path(netPts)}" fill="none" stroke="var(--ink-2)" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>` : ""}
      ${rugMarks(bucketRug(ids, buckets, sec, (i) => PAD.x + (i + 0.5) * slot), height)}
    </svg>`;

  attachProbe(host, host.querySelector("svg"), hits,
    (h) => {
      const net = h.up - h.down;
      return `<b>${net >= 0 ? "+" : "−"}${fmt(Math.abs(net))}</b> net${h.partial ? " so far" : ""}` +
        `<span class="tip-t">${bucketLabel(h.b, sec)}</span>` +
        `<div class="tip-rule"></div>` +
        `<div class="tip-row"><span class="swatch" style="background:var(--ink-2)"></span>${cap(metric.gained)}<span>+${fmt(h.up)}</span></div>` +
        `<div class="tip-row"><span class="swatch" style="background:var(--ink-2);opacity:0.4"></span>${cap(metric.lost)}<span>−${fmt(h.down)}</span></div>`;
    },
    { dot: false });

  axisEnds(axisTime(buckets[0]), "now");
}

function drawLaunch(host, width, height, ids) {
  const maxAge = rangeHours === 0 ? Infinity : rangeHours * 3600;
  const series = ids
    .map((id) => ({ id, pts: sinceLaunch(id).filter((p) => p[0] >= 0 && p[0] <= maxAge) }))
    .filter((s) => s.pts.length);
  if (!series.length) {
    emptyChart(host, height, "Collecting history — launch curves appear after the next sample");
    return;
  }

  const x1 = Math.max(...series.map((s) => s.pts.at(-1)[0]), 3600);
  const all = series.flatMap((s) => s.pts.map((p) => p[1]));
  const X = scaleX(0, x1, width);
  const Y = scaleY(Math.min(...all), Math.max(...all), height, heroLog);

  let body = "";
  const hits = [];
  for (const s of series) {
    const c = colorOf(s.id);
    const xy = s.pts.map((p) => [X(p[0]), Y(p[1])]);
    body += xy.length > 1
      ? `<path d="${path(xy)}" fill="none" stroke="${c}" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"/>`
      : "";
    // Hollow dot: the curve genuinely starts here, because tracking did — no
    // fabricated lead-in back to the axis.
    body += `<circle cx="${xy[0][0].toFixed(1)}" cy="${xy[0][1].toFixed(1)}" r="3.5"
                     fill="var(--surface)" stroke="${c}" stroke-width="2"/>`;
    s.pts.forEach((p, i) => hits.push({
      x: xy[i][0], y: xy[i][1], color: c, id: s.id, age: p[0], v: p[1], first: i === 0,
    }));
  }

  host.innerHTML = `
    <svg width="${width}" height="${height}" role="img"
         aria-label="${metric.label} against age since publish, ${launchLabel()}, one line per mod${heroLog ? ", logarithmic scale" : ""}">
      ${body}
      ${rugMarks(timeRug(
        series.map((s) => s.id),
        (t, id) => t - data.mods[id].created >= 0 && t - data.mods[id].created <= x1,
        (t, id) => X(t - data.mods[id].created)), height)}
    </svg>`;

  attachProbe(host, host.querySelector("svg"), hits,
    (h) => `<b>${fmt(h.v)}</b> ${metric.noun}<span class="tip-t">${shortOf(h.id)} · ${ageLabel(h.age)} old</span>` +
      (h.first && h.age > 3600 ? `<span class="tip-t">tracking began ${ageLabel(h.age)} after publish</span>` : ""),
    { yWeight: 1 });

  axisEnds("published", ageLabel(x1));
}

// Two jobs on one control. Unfocused it toggles a mod in or out of the chart;
// focused it switches which mod the page is about, which saves going back to
// the grid between every comparison.
function renderLegend() {
  const el = document.getElementById("hero-legend");
  const f = focused();
  if (!f && effMode() === "total") { el.innerHTML = ""; return; }
  el.innerHTML = createdOrder().map((id) => `
    <button type="button" class="leg" data-id="${id}"
            aria-pressed="${f ? id === f : !hiddenIds.has(id)}"
            title="${f ? `Focus ${shortOf(id)}` : `Show or hide ${shortOf(id)}`}">
      <span class="swatch" style="background:${colorOf(id)}"></span>${shortOf(id)}
    </button>`).join("");
}

// Every recorded edit with what followed it. The rug tooltips carry the same
// measurement two lines at a time; this is the version with room.
function renderLog(id) {
  const evs = [...eventsFor(id)].sort((a, b) => b - a);
  if (!evs.length) {
    return `<div class="log-row"><span class="log-when">No edits recorded yet</span></div>`;
  }
  return evs.map((t) => {
    const im = impact(id, t);
    let right;
    if (!im) right = `<span class="log-note">not enough history</span>`;
    else if (im.note) right = `<span class="log-note">${im.note}</span>`;
    else {
      const w = ageLabel(im.span);
      right = `<span class="log-impact">
        <span class="delta" data-dir="${im.after > 0 ? "up" : im.after < 0 ? "down" : "flat"}">${
          im.after === 0 ? "No change" : `${im.after > 0 ? "↑" : "↓"} ${fmt(Math.abs(im.after))}`} in the ${w} after</span>
        <span class="log-vs">against ${im.before >= 0 ? "+" : "−"}${fmt(Math.abs(im.before))} in the ${w} before</span>
      </span>`;
    }
    return `<div class="log-row"><span class="log-when">${absTime(t)}</span>${right}</div>`;
  }).join("");
}

/* ---------- render ---------- */

function syncControls() {
  const mode = effMode();
  const f = focused();

  const crumb = document.getElementById("crumb");
  crumb.hidden = !f;
  if (f) document.getElementById("crumb-cur").textContent = shortOf(f);

  document.getElementById("hero-label").innerHTML = f
    ? `<span class="swatch" style="background:${colorOf(f)};display:inline-block;margin-right:6px"></span>${shortOf(f)} · ${metric.noun}`
    : `Total ${metric.noun}`;
  document.getElementById("hero").setAttribute("aria-label",
    f ? `${shortOf(f)} ${metric.noun}` : `Total ${metric.noun}`);

  document.getElementById("cards-head").textContent = f ? "Updates" : "By mod";
  document.getElementById("sort-group").hidden = !!f;

  document.querySelectorAll("#metric button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.metric === metric.key));
  });
  document.querySelectorAll("#range button").forEach((b) => {
    b.setAttribute("aria-pressed", String(Number(b.dataset.hours) === rangeHours));
  });
  document.querySelectorAll("#mode button").forEach((b) => {
    b.hidden = (bucketed(b.dataset.mode) && !velocityOk())
      || (b.dataset.mode === "churn" && !metric.life)
      || (b.dataset.mode === "stacked" && !!f);
    b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    if (b.dataset.mode === "churn" && metric.life) {
      b.title = `Everyone who ${metric.gained} against what stuck`;
    }
  });

  const log = document.getElementById("hero-log");
  // Hidden rather than disabled in the additive modes: a log stack is
  // meaningless, and no control beats a wrong-but-plausible one.
  log.hidden = mode === "stacked" || bucketed(mode);
  log.setAttribute("aria-pressed", String(heroLog));

  // Carries what the row used to say in visible text: the same buttons read as a
  // zoom on each mod's opening stretch once the chart is measuring from launch.
  document.getElementById("range").setAttribute("aria-label",
    mode === "launch" ? "Window from each mod's launch" : "Comparison window");

  // Rebuilt every render: two of the labels move with the metric, and the two
  // ratio sorts drop out entirely under a metric that can't answer them.
  const active = effSort();
  const select = document.getElementById("sort");
  // Only written when it actually changes: the page re-renders every minute, and
  // replacing the options under an open menu closes it.
  const opts = Object.entries(SORTS)
    .filter(([k]) => sortOk(k))
    .map(([k, s]) => `<option value="${k}">${s.label()}</option>`).join("");
  if (select.innerHTML !== opts) select.innerHTML = opts;
  select.value = active.metric;
  const dir = document.getElementById("sortdir");
  dir.textContent = active.dir === "asc" ? "↑" : "↓";
  dir.setAttribute("aria-label",
    `Sorted ${active.dir === "asc" ? "ascending" : "descending"} — reverse`);
}

const kpiTile = (label, value, sub, help) =>
  `<div class="kpi"${help ? ` title="${help}"` : ""}><div class="k-label">${label}</div>` +
  `<div class="k-value">${value}</div>${sub}</div>`;

// The tiles carry the metrics the chart isn't carrying, so no figure on the page
// is printed twice. Rating holds its place whatever the chart shows: a
// proportion can't be summed across mods, so it is never a chart metric and this
// is the only place it lives.
function renderKpis() {
  const others = METRIC_LIST.filter((m) => m !== metric);

  let up = 0, down = 0, haveVotes = false;
  for (const id of scopeIds()) {
    const r = ratingOf(latest(id));
    if (r) { up += r.up; down += r.down; haveVotes = true; }
  }
  const rated = haveVotes && up + down > 0;

  const cm = churnMetric();
  const churn = churnWindow(cm);
  const lostSub = !churn ? "Needs two samples"
    : churn.joined ? `${pct(churn.lost / churn.joined)} of ${fmt(churn.joined)} who ${cm.gained} ${windowLabel()}`
    : `Nobody ${cm.gained} ${windowLabel()}`;

  document.getElementById("kpis").innerHTML =
    others.map((m) => kpiTile(m.label, fmt(totalNow(m.field)),
      deltaHtml(totalDelta(m.field), windowLabel()))).join("") +
    kpiTile("Rating", rated ? `${Math.round((up / (up + down)) * 100)}%` : "—",
      `<span class="delta" data-dir="flat">${
        rated ? `${fmt(up)} up · ${fmt(down)} down`
          : haveVotes ? "No votes yet" : "Needs a Steam API key"}</span>`) +
    kpiTile(cm.lostLabel, churn ? fmt(churn.lost) : "—",
      `<span class="delta" data-dir="flat">${lostSub}</span>`,
      `Everyone who ${cm.gained} in the window, minus what stuck`);
}

function render() {
  if (!data) return;

  syncControls();

  document.getElementById("hero-value").textContent = fmt(totalNow(metric.field));
  setDelta(document.getElementById("hero-delta"), totalDelta(metric.field));
  document.getElementById("hero-window").textContent = windowLabel();
  renderHeroChart();
  renderLegend();
  renderKpis();

  renderCards();
  renderTable();
  renderFreshness();
}

// Built in two passes: auto-fit grid tracks only settle once every card is in
// the DOM, and a sparkline measured before then draws at the full row width and
// spills into its neighbours.
// The tooltip is the only place the band explains itself, so it names the
// comparison outright: a tint that looks like a verdict on the mod, rather than
// on its standing among the others, would be the wrong reading.
function calPill(label, value, cal, help) {
  const band = calBand(cal, value);
  const note = band
    ? ` — ${band === "high" ? "above" : "below"} the spread across these ${cal.n} mods (average ${pct(cal.mean)})`
    : "";
  return `<span class="pill"${band ? ` data-cal="${band}"` : ""} title="${help}${note}">${
    label} <b>${pct(value)}</b>${band ? `<span class="cal">${band === "high" ? "▲" : "▼"}</span>` : ""}</span>`;
}

function renderCards() {
  const cards = document.getElementById("cards");
  const nowSec = Date.now() / 1000;
  const cutoff = rangeHours === 0 ? 0 : nowSec - rangeHours * 3600;
  const sec = bucketSec(rangeHours);
  const pending = [];
  cards.innerHTML = "";

  // Banded against every tracked mod, not just the ones on screen, so the
  // comparison doesn't shift under a sort or a filter.
  const calKeep = calibrate(data.order.map(keepOf));
  const calConv = calibrate(data.order.map(convOf));
  // Both pills fall away together under a metric that is its own lifetime total
  // and its own denominator, so every card loses the same row and the grid stays
  // level rather than going ragged.
  const pills = (id) =>
    [metric.life ? calPill("Keep", keepOf(id), calKeep, keepHelp()) : "",
     metric === METRICS.views ? "" : calPill("Conv", convOf(id), calConv, convHelp())]
      .join("");

  const f = focused();
  cards.classList.toggle("focus-view", !!f);
  if (f) {
    const fp = pills(f);
    cards.innerHTML =
      (fp ? `<div class="focus-pills">${fp}</div>` : "") +
      `<div class="log">${renderLog(f)}</div>`;
    return;
  }

  for (const id of sortedIds()) {
    const mod = data.mods[id];
    const row = latest(id);
    if (!mod || !row) continue;

    const was = baseline(id);
    const colorVar = SLOT_VAR[mod.slot] ?? "--s1";
    const r = ratingOf(row);
    const foot = METRIC_LIST.filter((m) => m !== metric);
    const pillRow = pills(id);

    const el = document.createElement("article");
    el.className = "card";
    el.dataset.id = id;
    el.innerHTML = `
      <div class="card-head">
        <span class="swatch" style="background:var(${colorVar})"></span>
        <a href="${mod.url}" target="_blank" rel="noopener">${mod.short}</a>
        <button type="button" class="card-focus" data-focus="${id}"
                aria-label="Open ${mod.short} on its own" title="Open ${mod.short} on its own">›</button>
      </div>
      <div class="card-value-row">
        <span class="card-value">${fmt(row[metric.field])}</span>
        <span class="card-value-label">${metric.noun}</span>
      </div>
      <span class="delta" data-dir="flat"></span>
      <div class="spark"></div>
      <div class="foot">
        ${foot.map((m) => `<div>${m.label}<b>${fmt(row[m.field])}</b></div>`).join("")}
        <div>Rating<b>${
          r && r.total ? `${Math.round(r.pct * 100)}%` : "<span class='hint'>—</span>"
        }</b></div>
      </div>
      ${pillRow ? `<div class="foot2">${pillRow}</div>` : ""}`;

    setDelta(el.querySelector(".delta"),
      was ? row[metric.field] - was[metric.field] : null, windowLabel());
    cards.appendChild(el);

    const host = el.querySelector(".spark");
    const rug = eventsFor(id);
    const mode = effMode();
    if (mode === "velocity" || mode === "churn") {
      const rows = rowsLive(id);
      const from = rangeHours === 0 ? (rows[0]?.[0] ?? nowSec) : cutoff;
      const opts = { label: mod.short, rug, id };
