      pending.push([host, mode === "churn"
        ? () => sparkflow(host, flow(id, from, nowSec, sec), colorVar, sec, opts)
        : () => sparkbars(host, velocity(id, from, nowSec, sec), colorVar, sec, opts)]);
    } else {
      const all = rowsLive(id).map((p) => [p[0], p[metric.field]]);
      const pts = all.filter((p) => p[0] >= cutoff);
      pending.push([host, () => sparkline(host, pts.length >= 2 ? pts : all, colorVar, { label: mod.short, rug, id })]);
    }
  }

  for (const [, draw] of pending) draw();
}

const signed = (n) => (n == null ? "—" : n === 0 ? "0" : (n > 0 ? "+" : "−") + nf.format(Math.abs(n)));

// Every number in plain text, so the columns are literal: the active metric's
// own column sits first and the derived columns beside it read off the same
// metric, which is what keeps a header from naming one thing and totalling
// another. The two stocks the chart isn't showing keep their own columns, so
// nothing on the page goes missing when the metric changes.
function renderTable() {
  const tbody = document.querySelector("#table tbody");
  const tfoot = document.querySelector("#table tfoot");
  const active = effSort();
  const cm = churnMetric();
  const others = METRIC_LIST.filter((m) => m !== metric);

  const th = (label, key, help) => {
    if (!key) return `<th scope="col">${label}</th>`;
    return `<th scope="col" aria-sort="${
      key !== active.metric ? "none" : active.dir === "asc" ? "ascending" : "descending"}">` +
      `<button type="button" class="th-sort" data-metric="${key}"${
        help ? ` title="${help}"` : ""}>${label}</button></th>`;
  };

  document.querySelector("#table thead tr").innerHTML =
    `<th scope="col">Mod</th>` +
    th(metric.label, metric.key) +
    th(`Change ${windowLabel()}`, "movers") +
    th(`${cm.lostLabel} ${windowLabel()}`, "left", `Everyone who ${cm.gained} in the window, minus what stuck`) +
    others.map((m) => th(m.label, m.key)).join("") +
    `<th scope="col">Rating</th><th scope="col">Votes</th>` +
    th(`Lifetime ${metric.noun}`, null) +
    th("Keep %", "keep", keepHelp()) +
    th("Conv %", "conv", convHelp());

  tbody.innerHTML = "";
  for (const id of sortedIds()) {
    const mod = data.mods[id], row = latest(id), was = baseline(id);
    if (!mod || !row) continue;
    const c = churnOf(id, cm);
    const r = ratingOf(row);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="name-cell"><span class="swatch" style="background:var(${SLOT_VAR[mod.slot] ?? "--s1"})"></span>${mod.short}</span></td>
      <td>${nf.format(row[metric.field])}</td>
      <td>${signed(was ? row[metric.field] - was[metric.field] : null)}</td>
      <td>${c == null ? "—" : c.lost === 0 ? "0" : "−" + nf.format(c.lost)}</td>
      ${others.map((m) => `<td>${nf.format(row[m.field])}</td>`).join("")}
      <td>${r && r.total ? Math.round(r.pct * 100) + "%" : "—"}</td>
      <td>${r ? `${r.up} / ${r.down}` : "—"}</td>
      <td>${metric.life ? nf.format(row[metric.life]) : "—"}</td>
      <td>${pct(keepOf(id))}</td>
      <td>${pct(convOf(id))}</td>`;
    tbody.appendChild(tr);
  }

  // A totals row under a single row is just that row again.
  if (focused()) { tfoot.innerHTML = ""; return; }

  const churn = churnWindow(cm);
  const now = totalNow(metric.field);
  const life = metric.life ? totalNow(metric.life) : null;
  const views = totalNow(FIELD.views);
  tfoot.innerHTML = `<tr>
    <td>Total</td>
    <td>${fmt(now)}</td>
    <td>${signed(totalDelta(metric.field))}</td>
    <td>${churn == null ? "—" : churn.lost === 0 ? "0" : "−" + nf.format(churn.lost)}</td>
    ${others.map((m) => `<td>${fmt(totalNow(m.field))}</td>`).join("")}
    <td></td><td></td>
    <td>${fmt(life)}</td>
    <td>${pct(now != null && life ? now / life : null)}</td>
    <td>${pct(metric !== METRICS.views && now != null && views ? now / views : null)}</td>
  </tr>`;
}

function renderFreshness() {
  const el = document.getElementById("freshness");
  const pulse = document.getElementById("pulse");
  // A recent live reading is the strongest freshness signal there is — it means
  // we just spoke to Steam. Only fall back to the recorded timestamp if live
  // polling has gone quiet, which is itself the thing worth surfacing.
  if (liveAt && Date.now() / 1000 - liveAt < 5 * 60) {
    el.textContent = `Live · checked ${relTime(liveAt)}`;
    el.title = absTime(liveAt);
    pulse.dataset.state = "live";
    return;
  }
  if (!data?.updated) { el.textContent = "No data yet"; pulse.dataset.state = "stale"; return; }
  const age = Date.now() / 1000 - data.updated;
  el.textContent = `Last change ${relTime(data.updated)}`;
  el.title = absTime(data.updated);
  // The poller heartbeats every 6h, so nothing newer than ~7h means it stalled.
  pulse.dataset.state = age > 7 * 3600 ? "stale" : "live";
}

/* ---------- load ---------- */

async function load() {
  const wrap = document.getElementById("wrap");
  wrap.dataset.loading = "true";
  try {
    // Query-bust the CDN in front of the data branch: it holds raw files for
    // ~5 minutes, which is now the whole poll interval, so serving a cached copy
    // would cost a full sample rather than a rounding error.
    const url = `${dataUrl()}?t=${Math.floor(Date.now() / 30_000)}`;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    document.getElementById("error-slot").innerHTML = "";
    render();
  } catch (err) {
    document.getElementById("pulse").dataset.state = "error";
    document.getElementById("error-slot").innerHTML =
      `<div class="err">Couldn't load history from the <code>${DATA_BRANCH}</code> branch ` +
      `(${err.message}). A 404 usually means one of: the repo is <b>private</b>, so ` +
      `raw.githubusercontent can't be read anonymously; the poller has never run, so the ` +
      `branch doesn't exist yet; or <code>DATA_REPO</code> doesn't match the repo.</div>`;
  } finally {
    wrap.dataset.loading = "false";
  }
}

// Deliberately silent on failure. The history load owns the error slot; a
// missing function is a deployment shape, not something the reader did wrong.
async function loadLive() {
  if (!liveOn) return;
  try {
    const res = await fetch(LIVE_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    live = json.rows ?? {};
    liveAt = json.t ?? Math.floor(Date.now() / 1000);
    // Stand in for history when it's unreachable — a private repo, or before the
    // poller's first run. The live payload carries the same mods/order shape, so
    // everything renders except the charts, which have nothing to plot. A
    // working page with flat lines beats an error where the numbers should be.
    if (!data && json.order) {
      data = { updated: liveAt, mods: json.mods ?? {}, order: json.order, series: {} };
    }
    if (data) render();
    renderFreshness();
  } catch {
    liveOn = false;
  }
}

/* ---------- wiring ---------- */

document.getElementById("metric").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (btn) setMetric(btn.dataset.metric);
});

document.getElementById("range").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  rangeHours = Number(btn.dataset.hours);
  localStorage.setItem("rangeHours", String(rangeHours));
  render();
});

document.getElementById("mode").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  heroMode = btn.dataset.mode;
  localStorage.setItem("heroMode", heroMode);
  render();
});

document.getElementById("hero-log").addEventListener("click", () => {
  heroLog = !heroLog;
  localStorage.setItem("heroLog", heroLog ? "1" : "0");
  render();
});

document.getElementById("hero-legend").addEventListener("click", (e) => {
  const btn = e.target.closest(".leg");
  if (!btn) return;
  const id = btn.dataset.id;
  if (focused()) { setFocus(id); return; }
  if (hiddenIds.has(id)) hiddenIds.delete(id); else hiddenIds.add(id);
  renderHeroChart();
  renderLegend();
});

// The whole card is a target for the mouse; the chevron is the one AT and the
// keyboard can reach, and the Steam link keeps its own job.
document.getElementById("cards").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const card = e.target.closest(".card[data-id]");
  if (card) setFocus(card.dataset.id);
});

document.getElementById("crumb-back").addEventListener("click", () => setFocus(null));

// Covers the back button and a pasted link, neither of which goes through
// setFocus.
addEventListener("hashchange", () => { focusId = readFocus(); render(); });

// Options are built in syncControls: two labels move with the metric, and two
// options drop out under a metric with no ratio behind them.
const sortSelect = document.getElementById("sort");
sortSelect.addEventListener("change", () => setSort(sortSelect.value, false));
document.getElementById("sortdir").addEventListener("click", () => setSort(effSort().metric, true));

document.querySelector("#table thead").addEventListener("click", (e) => {
  const btn = e.target.closest(".th-sort");
  if (btn) setSort(btn.dataset.metric, true);
});

document.getElementById("theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  // No re-render needed: every SVG paint is a var(), so the marks retheme live.
});

const savedTheme = localStorage.getItem("theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

// Poll while visible only, and catch up the moment the tab comes back. Visible-
// only matters more now that a poll costs a function invocation, not just a
// cached file read — a backgrounded tab shouldn't burn quota all night.
setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
setInterval(() => { if (!document.hidden) loadLive(); }, LIVE_MS);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  load();
  loadLive();
});
setInterval(renderFreshness, 30_000);

load();
loadLive();
</script>
</body>
</html>
